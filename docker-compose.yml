x-environment: &environment
  MYSQL_HOST: db
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_DB_LOG: db_log
  MYSQL_DB_AUTOREPORT: db_autoreport
  FALK_APP_ID: 80
  FALK_EXTENDED_USER_RIGHTS: "[{\"A\":80,\"R\":\"LC\",\"U\":1},{\"A\":80,\"R\":\"SC\",\"U\":2},{\"A\":81,\"R\":\"LC\",\"U\":2}]"
  USERORGID: "pilot"
  SHINYPROXY_USERNAME: test@tester.no
  SHINYPROXY_USERGROUPS: "pilot"
  SHINYPROXY_APPID: tech


services:
  db:
    image: mysql:26
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./dev/db:/docker-entrypoint-initdb.d

  app:
    image: rapporteket/rapadm:main
    depends_on:
      - db
    ports:
      - 3838:3838
    environment:
      << : *environment
    platform: "linux/amd64"

  dev:
    depends_on:
      - db
    image: rapporteket/rstudio
    volumes:
      - ~/.ssh:/home/rstudio/.ssh
      - ~/.gitconfig:/home/rstudio/.gitconfig
      - .:/home/rstudio/rapadm
      - ../rapbase/.:/home/rstudio/rapbase
    ports:
      - "8787:8787"
    environment:
      << : *environment
      DISABLE_AUTH: "true"

  adminer:
    depends_on:
      - db
    image: adminer
    restart: "no"
    environment:
      ADMINER_PLUGINS: frames
    ports:
      - 8888:8080
